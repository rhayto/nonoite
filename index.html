<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bons Sonhos</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
    
<div class="sky-wrapper">
    <div class="nebula-layer"></div>
    <div id="stars-far" class="star-layer"></div>
    <div id="stars-mid" class="star-layer"></div>
    <div id="stars-near" class="star-layer"></div>
    <div id="shooting-stars"></div>
</div>

<main>
    <div id="moon-wrapper">
        <div class="moon-halo"></div>
        <div id="moon"></div>
    </div>
    
    <section id="content">
        <div class="glass-panel">
            <div class="glass-reflection"></div>
            <h1>Seus Olhos cheios de estrelas sempre iluminam minha noite, cada dia com uma história diferente. Bons sonhos, mal posso esperar para te ver a cada dia!</h1>
        </div>
    </section>
</main>

<footer>Eu te amo! 💙</footer>

<script src="script.js"></script>
</body>
</html>
